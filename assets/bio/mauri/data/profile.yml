summary: >
  Nuclear physicist and simulation software developer at Jefferson Lab working
  on Geant4-based detector simulations, GEMC/GEMC3 and pygemc development,
  validated CAD geometry, CLAS12 production workflows, detector systems,
  and nucleon-structure research.

current_focus:
  - Geant4 simulation support and tutorials for Jefferson Lab users.
  - GEMC/GEMC3 and pygemc development, including CLAS12 geometry and detector-plugin migration.
  - CAD mesh repair and optimization with reproducible construction, overlap, and tracking checks.
  - Interactive visualization, Geant4 XR integration, multilingual tools, and portable build environments.
  - CLAS12 Low Threshold Cherenkov Counter operation, calibration, and performance.
  - Meson electro-production and nucleon-structure measurements.
  - simGrid production workflows, HTCondor queue management, and Open Science Grid operational support.
  - Reproducible scientific computing, documentation, tutorials, and examples.

experience:
  - role: Staff Scientist
    institution: Jefferson Laboratory
    location: Newport News, VA, USA
    dates: 2011-present
    highlights:
      - Supports Hall-B and CLAS12 detector, simulation, and analysis workflows.
      - Develops GEMC/GEMC3, pygemc, and CLAS12 geometry and detector plugins.
      - Repairs and optimizes CAD meshes with geometry validation and reproducible performance studies.
      - Maintains simGrid production workflows and queue management on HTCondor and Open Science Grid.
      - Develops visualization tools, multilingual interfaces, and cross-platform installation workflows.
      - Provides Geant4 support, tutorials, and examples for Jefferson Lab users.
      - Works on LTCC operation, calibration, maintenance, and performance.
  - role: Postdoctoral Research Associate and Research Associate
    institution: University of Connecticut
    location: Storrs, CT, USA
    dates: 2004-2011
    highlights:
      - Performed CLAS and related hadron-physics analyses.
      - Contributed to experiments at SPring-8, Japan.
      - Contributed to CLAS12 simulation and reconstruction software.
      - Worked on nucleon-structure measurements and meson electro-production.

